# Which skills maestro-play names in prompt steps (skills/README.md).
# To add your own: put skills/<name>/SKILL.md here, then list it, e.g.
#   prompts:
#     all: [my-style]        # every prompt step
#     build: [my-tdd]        # one step, by template name: playbooks/<playbook>/build.md
prompts:
  all: [maestro-working-principles]
  build: [maestro-tdd]
  verify: [maestro-prove-complete]
commands:                    # you call these; no prompt names them
  - maestro-create-ticket
  - maestro-review
  - maestro-planner
  - maestro-qa-lead
  - maestro-software-engineer
  - maestro-chief-of-staff
  - maestro-figure-it-out
  - maestro-swarm
  - maestro-sharpen
  - maestro-recall
  - maestro-unslop
  - maestro-prune
  - maestro-refactor-code
  - maestro-create-edit-skill
