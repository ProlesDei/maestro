# Which skills maestro-play names in prompt steps (skills/README.md).
# To add your own: put skills/<name>/SKILL.md here, then list it, e.g.
#   prompts:
#     all: [my-style]        # every prompt step
#     build: [my-tdd]        # one step, by template name in playbooks/prompts/
prompts:
  all: []
commands: [maestro-work, maestro-create-ticket, maestro-review]   # you call these; no prompt names them
