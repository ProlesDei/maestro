name: replace
role: chief-of-staff
description: Replace a plan with a new ticket and cancel the old one, which drops the lease.
intake: {category: request, status: todo}
claim: true
steps:
  - id: replacement
    ticket: create --title {{quote .ticket.title}} --role chief-of-staff --type scout --owner chief-of-staff
  - id: cancel
    ticket: transition {{.ticket.id}} --to cancelled --from todo
    on: {ok: end}
