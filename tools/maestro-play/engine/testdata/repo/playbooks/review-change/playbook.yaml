name: review-change
role: reviewer
description: Review a change on another model family; approve it or send it back.
intake: {category: new-work, status: in_review, latest: "Handoff:"}
claim: true
steps:
  - id: review
    prompt: review
    family: not-author
    out: [must_fix, notes]
  - id: verdict
    gate: '{{if .steps.review.reply.must_fix}}false{{else}}true{{end}}'
    on: {ok: pass, fail: send_back}
  - id: send_back
    ticket: transition {{.ticket.id}} --to in_progress --note "changes requested"
    on: {ok: end}
  - id: pass
    ticket: comment {{.ticket.id}} --body approved
block: {to: chief-of-staff}
