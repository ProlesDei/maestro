name: rollout
role: reviewer
description: Read the head, then run each check on its own; the first failure stops the rest.
intake: {category: new-work, status: in_review, role: any, title: "Rollout:"}
claim: true
steps:
  - id: each_check
    each: .project.checks
    run: ['head', 'check {{.item.name}}']
    on: {fail: done}
done:
  to: keep
  note: 'Rollout: {{.steps.each_check.outcome}}{{range .steps.each_check.results}} [{{.outcome}} {{.summary}}]{{end}}'
