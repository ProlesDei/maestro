name: split
role: chief-of-staff
description: Draft tickets for a plan and file them as one new ticket.
intake:
  - {category: request, status: todo}
  - {category: sent-back, status: in_progress}
claim: true
input: optional
steps:
  - id: draft
    prompt: tickets
    session: fresh
    with:
      goal: '{{.ticket.title}}'
    out: [tickets]
    block: {to: chief-of-staff}
  - id: create
    when: '{{if .steps.draft.reply.tickets}}true{{else}}false{{end}}'
    reason: nothing drafted
    ticket: create --title {{quote .ticket.title}} --role engineer --type ship
    body: '{{json .steps.draft.reply.tickets}}'
  - id: quiet
    gate: '{{eq .input.text "quiet"}}'
    on: {ok: end, fail: next}
done:
  to: '{{if .steps.draft.reply.tickets}}in_review{{else}}keep{{end}}'
  note: |
    Report: {{len .steps.draft.reply.tickets}} drafted, sha {{index .ticket.trailers "sha"}}, check {{latestLine .ticket "Check"}}.
    {{.run.skipped}}Done.
  log: 'split: {{len .steps.draft.reply.tickets}} tickets'
