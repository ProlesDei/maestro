name: rollout
role: operations-manager
description: Deploy, then smoke, each environment in order; the first failure stops the rest.
intake: {category: new-work, status: ready_to_release, role: any, title: "Rollout:"}
claim: true
steps:
  - id: deploy
    each: .project.environments
    run: ['deploy {{quote .item.name}}', 'smoke {{quote .item.name}}']
    on: {fail: done}
done:
  to: keep
  note: 'Rollout: {{.steps.deploy.outcome}}{{range .steps.deploy.results}} [{{.outcome}} {{.output}}]{{end}}'
