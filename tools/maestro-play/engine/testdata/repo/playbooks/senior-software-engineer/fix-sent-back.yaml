name: fix-sent-back
role: senior-software-engineer
description: Fix what review or QA sent back, then submit again.
intake: {category: sent-back, status: in_progress}
claim: true
steps:
  - id: docs_only
    gate: '{{eq .ticket.kind "docs"}}'
    on: {ok: build, fail: next}
  - id: baseline
    when:
      if: '{{ne .ticket.kind "docs"}}'
      reason: 'docs ticket, no baseline'
    prompt: plan
    out: [plan, risks]
  - id: build
    prompt: build
    retry: {max: 2, tier_up: true}
    out: [commit, files, tests]
  - id: checks
    run: check all
    on: {fail: build}
  - id: verify
    prompt: verify
    out: [criteria, failures]
    on: {failed: build}
done:
  to: in_review
  note: |
    Handoff: fixed at {{.steps.build.reply.commit}}.
    {{.run.skipped}}author-family: {{.env.family}}
