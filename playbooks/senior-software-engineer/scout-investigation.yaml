name: scout-investigation
role: senior-software-engineer
description: Answer an investigation ticket with an evidenced report, changing no code, and hand the report to the ticket's owner.
intake:
  - {category: new-work, status: todo, kinds: [investigation]}
  - {category: sent-back, status: in_progress, kinds: [investigation]}   # the owner wants more
claim: true
session: ticket
steps:
  - id: start
    when: '{{eq .ticket.status "todo"}}'
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: investigate               # frame, gather, weigh; experiments only in a temp dir; needs outside access: blocked
    prompt: investigate
    model: frontier
    out: [answer, confidence, findings, unknowns, next_tickets]
done:
  to: in_review
  role: "{{.ticket.owner}}"       # the owner reads the report and closes it (0009)
  note: |
    Report: {{json .steps.investigate.reply.answer}}
    Confidence: {{json .steps.investigate.reply.confidence}}
    Findings:{{range .steps.investigate.reply.findings}}
    - {{json .}}{{end}}
    Unknown:{{range .steps.investigate.reply.unknowns}}
    - {{json .}}{{end}}
    Recommended tickets:{{range .steps.investigate.reply.next_tickets}}
    - {{json .}}{{end}}
    {{.run.skipped}}Tries: {{.ticket.tries}}
