name: bug-fix
role: senior-software-engineer
description: Fix a bug by committing a test that fails because of it first, then the fix on its own maestro/ branch, and submit it for review.
intake: {category: new-work, status: todo, kinds: [bug],
         unless_latest: "Escalation:", unless_body: "Playbook: "}
claim: true
session: ticket
steps:
  - id: start
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: worktree
    run: worktree add {{.ticket.id}} --from {{.project.main_branch}}
  - id: reproduce                 # can't reproduce, or it's by design: blocked, never a guessed fix
    prompt: baseline
    mode: repro
    model: frontier
    out: [baseline, commit]
  - id: plan                      # plan.md's bug block: the root cause by file:line, and where else it appears
    prompt: plan
    mode: bug
    model: frontier
    out: [plan, cause, risks]
  - id: build
    prompt: build
    model: frontier
    retry: {max: 1, tier_up: false}
    out: [commit, files, tests]
  - id: checks
    run: check all
    on: {fail: build}
  - id: verify
    prompt: verify
    model: mid
    out: [criteria, failures]
    on: {failed: build}
done:
  to: in_review
  note: |
    Handoff: fixed on {{.run.branch}} at {{json .steps.build.reply.commit}}.
    Repro: {{json .steps.reproduce.reply.baseline}} failed at {{json .steps.reproduce.reply.commit}} (output {{.run.evidence_dir}}/repro-before.txt) and passes at {{json .steps.build.reply.commit}}.
    Cause: {{json .steps.plan.reply.cause}}
    Checks: {{json .steps.checks.summary}}
    Criteria:{{range .steps.verify.reply.criteria}}
    - {{json .}}{{end}}
    {{.run.skipped}}Tries: {{.ticket.tries}}
    branch: {{.run.branch}}
    sha: {{.steps.build.reply.commit}}
    author-family: {{.env.family}}
    author-role: {{.run.role}}
