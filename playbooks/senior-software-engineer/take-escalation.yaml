name: take-escalation
role: senior-software-engineer
description: Take over a ticket the Junior Engineer escalated, find what went wrong, finish it on the same branch and submit it.
intake: {category: request, status: todo, kinds: [feature, bug, chore, docs], latest: "Escalation:"}
claim: true
session: ticket
steps:
  - id: start
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: takeover                  # fix-sent-back counts this ticket's Tries from here
    ticket: 'comment {{.ticket.id}} --body "tries-at-takeover: {{.ticket.tries}}"'
  - id: worktree                  # the junior's branch, never deleted; starting over reverts on it
    run: worktree add {{.ticket.id}}
  - id: feedback                  # reads the escalation, the branch and its failing output; decides to continue or revert and start over
    prompt: feedback
    mode: takeover
    model: frontier
    out: [items, cause, decision]
  - id: build
    prompt: build
    model: frontier
    retry: {max: 1, tier_up: false}
    out: [commit, files, tests]
  - id: checks
    run: check all
    on: {fail: build}
  - id: verify
    prompt: verify
    model: mid
    out: [criteria, failures]
    on: {failed: build}
done:
  to: in_review
  note: |
    Handoff: took over from the Junior Engineer and built on {{.run.branch}} at {{json .steps.build.reply.commit}}.
    What made it hard: {{json .steps.feedback.reply.cause}}
    Branch: {{json .steps.feedback.reply.decision}} (on the junior's branch; anything reverted is still in the history).
    Checks: {{json .steps.checks.summary}}
    Criteria:{{range .steps.verify.reply.criteria}}
    - {{json .}}{{end}}
    {{.run.skipped}}Tries: {{.ticket.tries}}
    branch: {{.run.branch}}
    sha: {{.steps.build.reply.commit}}
    tries-at-takeover: {{index .ticket.trailers "tries-at-takeover"}}
    author-family: {{.env.family}}
    author-role: {{.run.role}}
