name: build-ticket
role: junior-software-engineer
description: Build a routine ticket by following an existing pattern in the code, reproducing bugs first, and submit it for review, or hand it to the Senior Engineer.
intake: {category: new-work, status: todo, kinds: [feature, bug, chore, docs]}
claim: true
session: ticket
steps:
  - id: start
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: worktree
    run: worktree add {{.ticket.id}} --from {{.project.main_branch}}
  - id: plan                      # no pattern to follow, or a design decision: blocked, so the senior takes it
    prompt: plan
    mode: pattern
    model: mid
    out: [plan, example, risks]
  - id: reproduce
    when: '{{eq .ticket.kind "bug"}}'
    prompt: baseline
    mode: repro
    model: mid
    out: [baseline, commit]
  - id: build
    prompt: build
    model: mid
    retry: {max: 1, tier_up: true}
    out: [commit, files, tests]
  - id: checks
    run: check all
    on: {fail: build}             # failing checks aren't a try; step_visits caps the loop
  - id: verify
    prompt: verify
    model: mid
    out: [criteria, failures]
    on: {failed: build}
done:
  to: in_review
  note: |
    Handoff: built on {{.run.branch}} at {{json .steps.build.reply.commit}}, following {{json .steps.plan.reply.example}}.
    {{- with .steps.reproduce.reply.commit}}
    Repro: {{json $.steps.reproduce.reply.baseline}} failed at {{json .}} (output {{$.run.evidence_dir}}/repro-before.txt) and passes at {{json $.steps.build.reply.commit}}.{{end}}
    Checks: {{json .steps.checks.summary}}
    Criteria:{{range .steps.verify.reply.criteria}}
    - {{json .}}{{end}}
    {{.run.skipped}}Tries: {{.ticket.tries}}
    branch: {{.run.branch}}
    sha: {{.steps.build.reply.commit}}
    author-family: {{.env.family}}
    author-role: {{.run.role}}
block:
  to: senior-software-engineer    # Escalation: at todo; the senior's take-escalation picks it up
