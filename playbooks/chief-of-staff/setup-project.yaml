name: setup-project
role: chief-of-staff
description: Onboard a repo after scripts/install.sh has run, by drafting project-setup.md from the repo, confirm it with the user, with its definition of done, and start the verification guide.
intake: {category: request}
input: optional
claim: false
session: run
steps:
  - id: installed
    ask:
      question: 'Ask the user whether they ran scripts/install.sh on this repo. It copies the skills and creates .maestro/project/ and .maestro/local/; setup needs it first.'
      choices: [installed, not_installed]
    on: {not_installed: not_installed}
  - id: draft
    prompt: draft-setup
    mode: setup
    model: mid
    out: [draft, sources, asks]
  - id: confirm
    ask:
      question: |
        Show the user a short summary of the draft in {{.steps.draft.reply.draft}}, then ask each of these one at a time,
        each with a recommended answer: {{json .steps.draft.reply.asks}}
        Put every answer in --text, one "<item>: <answer>" per line.
      choices: [confirmed, not_confirmed]
    on: {not_confirmed: unconfirmed}
  - id: answers
    prompt: draft-setup
    mode: setup-answers
    with: {answers: '{{.steps.confirm.text}}'}
    model: mid
    out: [draft, changed, asks]
  - id: answered
    gate: '{{not .steps.answers.reply.asks}}'
    on: {fail: confirm}
  # The definition of done, on this draft, so write puts the file down once.
  # Same prompts and gates as chief-of-staff/definition-of-done.
  - id: dod
    prompt: draft-setup
    mode: dod
    model: mid
    out: [draft, items, floor]
  - id: floor
    gate: '{{$f := .steps.dod.reply.floor}}{{and (eq (print $f.verification) "true") (eq (print $f.review) "true") (eq (print $f.merge_queue) "true") (eq (print $f.investigation) "true")}}'
    on: {fail: dod}
  - id: dod_confirm
    ask:
      question: |
        Show the user the definition of done in {{.steps.dod.reply.draft}}: per ticket type, each item, how it's checked
        and its source. Items marked floor are Maestro's minimum; nothing goes below them. Put each change in --text.
      choices: [confirmed, changed, not_confirmed]
    on: {not_confirmed: unconfirmed}
  - id: dod_apply
    prompt: draft-setup
    mode: dod-answers
    with: {answers: '{{.steps.dod_confirm.choice}}: {{.steps.dod_confirm.text}}'}
    model: mid
    out: [draft, diff, floor]
  - id: floor_kept
    gate: '{{$f := .steps.dod_apply.reply.floor}}{{and (eq (print $f.verification) "true") (eq (print $f.review) "true") (eq (print $f.merge_queue) "true") (eq (print $f.investigation) "true")}}'
    on: {fail: dod_apply}
  - id: write
    run: install write .maestro/project/project-setup.md --from {{quote .steps.dod_apply.reply.draft}}
  - id: verify_guide
    ticket: create --type ship --owner chief-of-staff --role qa-lead --title "Verification guide"
    body: |
      Type: chore
      Write .maestro/project/verify.md from .maestro/project/project-setup.md.
  - id: tell
    ask:
      question: |
        Tell the user setup is done: the trust level is 1 (pull requests only),
        and next QA writes the verification guide ({{.steps.verify_guide.json.id}}).
      choices: [sent]
    on: {sent: done}
  - id: not_installed
    ask:
      question: 'Tell the user to run scripts/install.sh <this repo> from their Maestro checkout first, then start setup again; nothing was written.'
      choices: [sent]
    on: {sent: end}
  - id: unconfirmed
    ask:
      question: 'Tell the user the draft stays in the scratch dir and nothing was written; you''ll ask again at the next recap.'
      choices: [sent]
    on: {sent: end}
done:
  log: 'setup: verification guide {{.steps.verify_guide.json.id}}; {{.run.skipped}}'
