name: status-brief
role: chief-of-staff
description: Send the user a short status brief on a schedule, built from workstream summaries, but only when something changed since the last one.
intake: {category: scheduled}
claim: false
cursor: {name: brief, save: '{{.steps.summary.json.next_seq}}'}   # saved only at done, so a failed send repeats
steps:
  - id: events
    ticket: events --since {{.cursor}} --limit 1
    on: {fail: unreadable}
  - id: wake
    gate: '{{if .steps.events.json.events}}true{{else}}false{{end}}'
    on: {fail: end}                  # nothing changed: no brief
  - id: summary
    run: summary --since {{.cursor}}
    on: {fail: unreadable}
  - id: send
    ask:
      question: |
        Send the user a status brief built only from {{.steps.summary.output_path}}.
        At most 10 lines under Shipped, In flight, Blocked and on whom, Needs you (each with a recommendation).
        Every line cites a goal or workstream. Invent nothing.
      choices: [sent, failed]
    on: {sent: done, failed: end}
  - id: unreadable
    ask:
      question: 'Tell the user the board can''t be read: {{if .steps.events.exit_code}}ticket events exited {{.steps.events.exit_code}}{{else}}summary exited {{.steps.summary.exit_code}}{{end}}. Don''t guess a brief.'
      choices: [sent]
    on: {sent: end}
done:
  log: 'status brief: events {{.cursor}} to {{.steps.summary.json.next_seq}}'
