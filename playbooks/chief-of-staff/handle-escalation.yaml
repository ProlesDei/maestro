name: handle-escalation
role: chief-of-staff
description: Resolve a ticket forwarded to the Chief of Staff, such as a Gate approval, a question above the owner's authority or a workflow suggestion, and bring the user only what needs them.
intake: {category: request, status: blocked, latest: "Escalation (chief-of-staff):", role: any}   # a forward keeps the owner's role
input: optional                      # the user's answer, when the user starts the run with --ticket; recap posts it as a note instead
claim: true
steps:
  - id: read
    ticket: get {{.ticket.id}}
  - id: decide
    ask:
      question: |
        {{.ticket.id}} ({{.ticket.type}}, {{.ticket.kind}}, blocked from {{.ticket.blocked_from}}, owner {{.ticket.owner}}):
        {{latest .ticket "Escalation (chief-of-staff):"}}
        {{- with latest .ticket "Handoff: waiting on the user:"}}
        You asked the user: {{.}}{{end}}
        {{- with .input.text}}
        The user answered: {{.}}{{end}}
        Read this ticket and the tickets it points to, never code.
        - approve or decline: it's within your authority and the trust level, or the user has answered.
          An Approved: for a Gate cites the user's answer. A Declined: says what would change it. --text is the decision and the reason.
        - ask_user: a Gate above the trust level, scope, cost, risk to users or data, anything that can't be undone,
          or a persona or authority change. --text is one question with the options and your recommendation.
        - cancel: drop the ticket. --text is why.
        A workflow suggestion is decided by its class in "Changing Maestro" in the team rules.
      choices: [approve, decline, ask_user, cancel]
    on: {approve: proposal_back, decline: proposal_back, ask_user: ask_user, cancel: cancel}
  - id: proposal_back
    ticket: transition {{.ticket.id}} --to in_review --from blocked
    when: '{{and (eq .ticket.type "scout") (eq .ticket.owner "chief-of-staff")}}'
    reason: not a workflow suggestion you own
  - id: upstream
    ask:
      question: 'Tell the user what should change in Maestro upstream for {{.ticket.id}}. It''s never pushed upstream from their install.'
      choices: [sent]
    when: '{{and (eq .ticket.type "scout") (eq .ticket.owner "chief-of-staff") (eq .steps.decide.choice "approve")}}'
    reason: not an accepted change to Maestro
  - id: record
    ticket: comment {{.ticket.id}}
    # "Approved by the user:" only when the user answered: release's deploy gate needs exactly that (0755).
    body: >-
      {{- if ne .steps.decide.choice "approve"}}Declined:
      {{- else if or .input.text (hasPrefix (latest .ticket "Escalation (chief-of-staff):") "Escalation (chief-of-staff): the user answered:")}}Approved by the user:
      {{- else}}Approved:{{end}} {{.steps.decide.text}}
      {{- if hasPrefix (latest .ticket "Handoff: QA passed") "Handoff: QA passed"}}{{with line "sha" (latest .ticket "Handoff: QA passed")}} (for sha {{.}}){{end}}{{end}}
    on: {ok: done}
  - id: ask_user
    ask:
      question: 'Ask the user, and nothing else in the same message: {{.steps.decide.text}}'
      choices: [sent]
  - id: waiting
    ticket: comment {{.ticket.id}}
    body: 'Handoff: waiting on the user: {{.steps.decide.text}}'
    on: {ok: end}                    # stays blocked; the answer comes back as --input on a later run
  - id: cancel
    ticket: >-
      transition {{.ticket.id}} --to cancelled --note {{quote (printf "Declined: %s" .steps.decide.text)}}
    on: {ok: end}
done:
  # A workflow suggestion you own closes; anything else goes back where it was blocked from. Never done on a ship ticket.
  to: '{{if eq .ticket.type "scout"}}{{if eq .ticket.owner "chief-of-staff"}}done{{else}}{{.ticket.blocked_from}}{{end}}{{else}}{{.ticket.blocked_from}}{{end}}'
  role: '{{or (latestLine .ticket "Return-role") .ticket.role}}'
  actor: chief-of-staff
  note: |
    Handoff: the Chief of Staff {{.steps.decide.choice}}d it: {{.steps.decide.text}}
    {{.run.skipped}}
