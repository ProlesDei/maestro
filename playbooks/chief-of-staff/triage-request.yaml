name: triage-request
role: chief-of-staff
description: Turn a user request into a direct answer or a workstream for the Planner, and tell the user what happens next.
intake: {category: request}
input: required                      # the user's message
claim: false
steps:
  - id: summary
    run: summary
    on: {fail: unreadable}
  - id: classify
    ask:
      question: |
        The user asked: {{.input.text}}
        Already under way: the goals and workstreams in {{.steps.summary.output_path}}.
        You manage goals and workstreams, never single tickets. Pick one:
        - answer: you can answer it directly. --text is the answer.
        - existing: new work for a workstream (small-tasks for a small ask that fits no goal).
        - new: a new workstream.
        - refuse: it goes against the team rules or the trust level. --text says why.
        For existing and new, --text has the lines "Workstream: <name>", "Goal: <goal, or outside the active bets>"
        and "Brief: <constraints, deadlines, what the Planner may decide alone>".
        If it's unclear in a way that changes the work, or needs a decision only the user can make,
        ask the user one short question with a recommended answer first, and answer this when they reply.
      choices: [answer, existing, new, refuse]
    on: {answer: tell, existing: plan, new: plan, refuse: tell}
  - id: plan
    ticket: >-
      create --type scout --owner planner --role planner
      --title {{quote (printf "Plan: %s" (line "Workstream" .steps.classify.text))}}
    body: |
      Type: investigation
      {{.steps.classify.text}}
  - id: tell
    ask:
      question: |
        Tell the user what happens next, in one or two lines:
        {{- if eq .steps.classify.choice "answer"}} your answer: {{.steps.classify.text}}
        {{- else if eq .steps.classify.choice "refuse"}} why you won't do it: {{.steps.classify.text}}
        {{- else}} workstream {{line "Workstream" .steps.classify.text}} has planning ticket {{.steps.plan.json.id}}; the Planner turns it into tickets next.{{end}}
      choices: [sent]
    on: {sent: done}
  - id: unreadable
    ask:
      question: 'Tell the user the board can''t be read: summary exited {{.steps.summary.exit_code}}. Don''t guess.'
      choices: [sent]
    on: {sent: end}
done:
  log: 'triage: {{.steps.classify.choice}}{{with index .steps.plan.json "id"}} {{.}}{{end}}; {{.run.skipped}}'
