name: answer-escalation
role: planner
description: As a ticket's owner, answer an escalation from the team and unblock the ticket, or forward it to the Chief of Staff when it's above your authority.
intake: {category: request, status: blocked, owner: planner, latest: "Escalation:"}
claim: true
session: ticket
steps:
  - id: read
    ticket: get {{.ticket.id}}
  - id: facts
    prompt: investigate
    mode: escalation
    model: mid
    out: [question, options, facts, sources, recommendation, within_authority]
  - id: decide
    ask:
      question: |
        {{.ticket.id}} is blocked: {{.steps.facts.reply.question}}
        Facts: {{json .steps.facts.reply.facts}} (sources: {{json .steps.facts.reply.sources}})
        Options: {{json .steps.facts.reply.options}}
        Recommendation: {{.steps.facts.reply.recommendation}}{{if not .steps.facts.reply.within_authority}} (the harness thinks this is above your authority){{end}}
        Decide when it's within your authority: criteria, splitting or re-routing, order, a known limit.
        Forward scope, cost, risk to users or data, product decisions and Gates.
        Put the answer, or what's above you, in --text.
      choices: [approve, decline, cancel, forward]
    on: {approve: fix, decline: fix, cancel: cancel, forward: forward}
  - id: fix
    prompt: tickets
    mode: escalation
    with: {answer: '{{.steps.decide.choice}}: {{.steps.decide.text}}'}   # the session can't see your answer otherwise
    model: mid
    out: [comment, tickets]
  - id: none_blocked
    gate: '{{$ok := true}}{{range .steps.fix.reply.tickets}}{{if not (or (eq (print .status) "todo") (eq (print .status) "backlog"))}}{{$ok = false}}{{end}}{{end}}{{$ok}}'
    on: {fail: fix}                 # a ticket waits through --deps, never as blocked
  - id: split
    each: .steps.fix.reply.tickets
    ticket: >-
      create --type {{quote .item.type}} --role {{quote .item.role}} --priority {{quote (print .item.priority)}}
      --owner planner --status {{quote .item.status}} --title {{quote .item.title}}
      {{- with index .item "areas"}} --areas {{quote (join . ",")}}{{end}}
      {{- with index .item "deps"}} --deps {{quote (join . ",")}}{{end}}
    body: |
      Type: {{.item.kind}}
      Goal: {{.item.goal}}
      Acceptance criteria:{{range .item.criteria}}
      - {{.}}{{end}}
      Split from {{$.ticket.id}}.
    on: {ok: done}
  - id: cancel
    ticket: >-
      transition {{.ticket.id}} --to cancelled --note {{quote (printf "Declined: %s" .steps.decide.text)}}
    on: {ok: end}
  - id: forward
    ticket: comment {{.ticket.id}}
    body: |
      Escalation (chief-of-staff): {{.steps.decide.text}}
      Options: {{json .steps.facts.reply.options}}
      Recommendation: {{.steps.facts.reply.recommendation}}
      Original: {{latest .ticket "Escalation:"}}
    on: {ok: end}                    # 0435: a forward is a note and a release, never a move
done:
  to: '{{.ticket.blocked_from}}'
  role: '{{or (latestLine .ticket "Return-role") .ticket.role}}'
  note: |
    {{if eq .steps.decide.choice "approve"}}Approved:{{else}}Declined:{{end}} {{.steps.decide.text}}
    {{- with .steps.fix.reply.comment}}
    {{.}}{{end}}
    {{- range .steps.split.results}}
    New ticket: {{.json.id}}{{end}}
    Next: {{or (latestLine .ticket "Return-role") .ticket.role}} picks it up from {{.ticket.blocked_from}}.
    {{.run.skipped}}
