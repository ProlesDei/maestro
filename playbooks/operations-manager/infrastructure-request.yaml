name: infrastructure-request
role: operations-manager
description: Plan an infrastructure request, such as an environment, service or pipeline change, route it to an engineer or to the user to apply, and close it once verified.
intake: {category: request, status: todo, type: scout, kinds: [chore], owner: operations-manager}
claim: true
session: ticket
steps:
  - id: plan
    prompt: plan
    mode: infrastructure
    model: mid
    when: >-
      {{- $planned := false}}{{$applied := false}}{{range .ticket.comments}}
      {{- if hasPrefix .body "Handoff: plan for the user to apply."}}{{$planned = true}}{{$applied = false}}{{end}}
      {{- if and $planned (hasPrefix .body "Approved")}}{{$applied = true}}{{end}}
      {{- end}}{{not $applied}}
    reason: the user applied the plan (an Approved comment came after the plan note)
    out: [plan, in_repo, commands, check, smoke, rollback, production, cost, risk]
  - id: route
    gate: '{{eq (print .steps.plan.reply.in_repo) "true"}}'
    when: '{{not .steps.plan.skipped}}'
    reason: the user applied the plan
    on: {ok: replace, fail: plan_note}   # repo files: an engineer ticket; anything else: the user applies it
  - id: start
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: verify_check
    run: 'check {{quote (line "Check" (latest .ticket "Handoff: plan for the user to apply."))}}'
    when: '{{ne (line "Check" (latest .ticket "Handoff: plan for the user to apply.")) ""}}'
    reason: the plan names no check
    block: {to: chief-of-staff}
  - id: verify_smoke
    run: 'smoke {{quote (line "Smoke" (latest .ticket "Handoff: plan for the user to apply."))}}'
    when: '{{ne (line "Smoke" (latest .ticket "Handoff: plan for the user to apply.")) ""}}'
    reason: the plan names no smoke check, so it's verified by the user only
    block: {to: chief-of-staff}
  - id: review
    ticket: transition {{.ticket.id}} --to in_review --from in_progress
    on: {ok: done}
  - id: plan_note
    ticket: comment {{.ticket.id}}
    body: |
      Handoff: plan for the user to apply.
      {{.steps.plan.reply.plan}}
      Commands:{{range .steps.plan.reply.commands}}
      - {{.}}{{end}}
      Check: {{.steps.plan.reply.check}}
      Smoke: {{.steps.plan.reply.smoke}}
      Rollback: {{.steps.plan.reply.rollback}}
      Production: {{.steps.plan.reply.production}}. Cost: {{.steps.plan.reply.cost}}. Risk: {{.steps.plan.reply.risk}}.
    on: {ok: block}
    block: {to: chief-of-staff}      # blocked for chief-of-staff while the user applies it; Approved: brings it back to todo
  - id: replace
    ticket: >-
      create --type ship --role senior-software-engineer --owner planner --priority {{.ticket.priority}}
      --title {{quote .ticket.title}}{{with .ticket.areas}} --areas {{join . ","}}{{end}}
    body: |
      Type: chore
      {{.steps.plan.reply.plan}}
      Rollback: {{.steps.plan.reply.rollback}}
      Replaces {{.ticket.id}}.
  - id: cancel
    ticket: transition {{.ticket.id}} --to cancelled --from todo --note {{quote (printf "Replaced by %s" .steps.replace.json.id)}}
    on: {ok: end}
done:
  to: done
  actor: operations-manager          # a scout you own
  note: |
    Handoff: infrastructure in place, applied by the user per {{latest .ticket "Approved"}}
    Plan: {{latest .ticket "Handoff: plan for the user to apply."}}
    Verified: {{if and .steps.verify_check.skipped .steps.verify_smoke.skipped}}by the user only, with the evidence in their Approved:{{else}}{{.steps.verify_check.output_path}} {{.steps.verify_smoke.output_path}}{{end}}
    Rollback: {{line "Rollback" (latest .ticket "Handoff: plan for the user to apply.")}}
    {{.run.skipped}}
