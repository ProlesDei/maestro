name: housekeeping
role: operations-manager
description: On a schedule, remove what finished tickets left behind, rotate logs and snapshot the ticket store, without touching anything a live lease or the user owns.
intake: {category: scheduled}
claim: false
# No prompt steps: runner housekeep checks ticket states, leases, pull requests and Maestro's paths itself.
steps:
  - id: plan
    run: housekeep
  - id: wake
    gate: '{{if or .steps.plan.json.items (not .steps.plan.json.snapshot_recent)}}true{{else}}false{{end}}'
    on: {fail: end}                  # empty plan and a recent snapshot
  - id: apply
    run: housekeep --apply {{quote .steps.plan.json.plan}}
  - id: doctor
    ticket: doctor
    on: {ok: done, fail: store_broken}
  - id: store_broken
    ticket: create --type ship --role operations-manager --owner operations-manager --status blocked --title "Ticket store failed its health check"
    body: |
      Type: chore
      ticket doctor output: {{.steps.doctor.output}}
  - id: store_escalation
    ticket: comment {{.steps.store_broken.json.id}}
    body: |
      Escalation (chief-of-staff): ticket store failed its health check
      Doctor output: {{.steps.doctor.output}}
      Changed nothing else. A failed environment check (filesystem, locks, a bare repo or a submodule) isn't store damage: the user fixes the machine, not the store.
    on: {ok: end}
done:
  log: 'housekeeping: removed {{len .steps.plan.json.items}}; snapshot {{.steps.apply.json.snapshot}}; {{.run.skipped}}'
