name: memory-curation
role: operations-manager
description: On a schedule, accept or reject memory proposals from the inbox, flag memories whose files changed, and archive the rest to stay under the size budget.
intake: {category: scheduled}
claim: false
session: run
steps:
  - id: scan
    run: memory scan
    on: {fail: end}                  # report the exit code in the log; change nothing
  - id: wake
    gate: '{{if or .steps.scan.json.proposals .steps.scan.json.flagged .steps.scan.json.over_budget}}true{{else}}false{{end}}'
    on: {fail: end}                  # nothing to curate: no session
  - id: worktree
    run: worktree add memory-{{.run.date}} --branch maestro/memory-{{.run.date}} --from {{.project.main_branch}}
  - id: proposals
    prompt: curate
    mode: proposals
    model: mid
    with: {scan: '{{.steps.scan.output_path}}'}
    when: '{{if .steps.scan.json.proposals}}true{{else}}false{{end}}'
    reason: the inbox is empty
    out: [verdicts, changed]
  - id: flagged
    prompt: curate
    mode: flagged
    model: mid
    with: {scan: '{{.steps.scan.output_path}}'}
    when: '{{if .steps.scan.json.flagged}}true{{else}}false{{end}}'
    reason: memory scan flagged none
    out: [verdicts, changed]
  - id: budget
    prompt: curate
    mode: budget
    model: mid                       # the template rechecks the size after the steps above and archives, never deletes
    with: {scan: '{{.steps.scan.output_path}}'}
    out: [archived, size_before, size_after, changed]
  - id: commit
    prompt: curate
    mode: commit
    model: mid
    with: {scan: '{{.steps.scan.output_path}}'}
    when: '{{if or (index .steps.proposals.reply "changed") (index .steps.flagged.reply "changed") (index .steps.budget.reply "changed")}}true{{else}}false{{end}}'
    reason: no memory changed
    out: [commit, files]
  - id: pr
    run: open pr --branch maestro/memory-{{.run.date}}
    when: '{{not .steps.commit.skipped}}'
    reason: no commit
done:
  log: >-
    memory: proposals {{with index .steps.proposals.reply "verdicts"}}{{len .}}{{else}}0{{end}},
    flagged {{with index .steps.flagged.reply "verdicts"}}{{len .}}{{else}}0{{end}},
    archived {{with index .steps.budget.reply "archived"}}{{len .}}{{else}}0{{end}}; {{.run.skipped}}
