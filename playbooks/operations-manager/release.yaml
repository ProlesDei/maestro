name: release
role: operations-manager
description: Ship a QA-passed ticket within the trust level, as a pull request at level 1 or through the merge queue above it, and set it done once it has landed.
intake: {category: new-work, status: ready_to_release, type: ship, kinds: [feature, bug, chore, docs], role: any}   # the ticket keeps its author's role
claim: true
# No prompt steps: every release gate is a comparison, so a release spends no tokens.
steps:
  - id: pr_state
    run: pr status {{.ticket.id}}
    when: '{{$pr := latest .ticket "Handoff: PR opened"}}{{and (ne $pr "") (eq $pr (latest .ticket "Handoff: "))}}'
    reason: no pull request opened since the last handoff
  - id: still_open
    gate: '{{eq .steps.pr_state.json.state "open"}}'
    when: '{{not .steps.pr_state.skipped}}'
    reason: no pull request yet
    on: {ok: end, fail: next}        # open: nothing to do, no status change
  - id: closed
    gate: '{{eq .steps.pr_state.json.state "closed"}}'
    when: '{{not .steps.pr_state.skipped}}'
    reason: no pull request yet
    on: {ok: block, fail: was_merged}   # closed without merging: escalate to the owner
  - id: was_merged                 # merged, with a merge sha, from the head QA passed; any other state blocks
    gate: >-
      {{- $pr := .steps.pr_state.json}}{{and (eq (print (index $pr "state")) "merged") (ne (print (or (index $pr "merge_sha") "")) "")
      (eq (print (index $pr "sha")) (line "sha" (latest .ticket "Handoff: QA passed")))}}
    when: '{{not .steps.pr_state.skipped}}'
    reason: no pull request yet
    on: {ok: landed}
  - id: qa_passed
    gate: '{{$qa := latest .ticket "Handoff: QA"}}{{and (ne $qa "") (eq $qa (latest .ticket "Handoff: QA passed"))}}'
  - id: head
    run: head {{.ticket.id}}
  - id: qa_sha
    gate: '{{eq .steps.head.json.sha (line "sha" (latest .ticket "Handoff: QA passed"))}}'
    on: {fail: new_commits}
  - id: reviewed_sha               # QA passed the commit review approved, not a later one
    gate: '{{eq (line "sha" (latest .ticket "Handoff: approved")) (line "sha" (latest .ticket "Handoff: QA passed"))}}'
  - id: other_family
    gate: >-
      {{- $review := latest .ticket "Handoff: approved"}}{{$f := line "review-family" $review}}
      {{- $a := latestLine .ticket "author-family"}}{{and (ne $review "") (ne $f "") (ne $a "") (ne $f $a)}}
  - id: rollback_set
    gate: '{{$ok := true}}{{range .project.environments}}{{if not .rollback}}{{$ok = false}}{{end}}{{end}}{{$ok}}'
  - id: trust
    run: trust {{.ticket.id}}
  - id: approved
    # Only an approval for the sha QA passed counts, so an old or early one never does.
    gate: '{{or (not .steps.trust.json.needs_user) (contains (latest .ticket "Approved by the user:") (printf "(for sha %s)" (line "sha" (latest .ticket "Handoff: QA passed"))))}}'
    when: '{{if and .project.environments .steps.trust.json.deploy}}true{{else}}false{{end}}'
    reason: no deploy step, or the trust level is below 4
    block: {to: chief-of-staff}      # before the merge: migrations, auth and payments need the user unless they allowed them
  - id: open_pr
    run: open pr {{.ticket.id}}
    when: '{{not .steps.trust.json.merge}}'
    reason: 'trust level {{.steps.trust.json.level}} allows the merge queue for {{.steps.trust.json.risk}} risk'
  - id: pr_opened
    ticket: comment {{.ticket.id}}
    when: '{{not .steps.open_pr.skipped}}'
    reason: merged through the queue
    body: |
      Handoff: PR opened {{.steps.open_pr.json.url}}
      Head: {{.steps.head.json.sha}}, the sha QA passed. A human merges it; the next run confirms it landed.
    on: {ok: end}                    # stays ready_to_release
  - id: merge
    run: merge {{.ticket.id}}        # Gate: reached only when trust says merge; the runner refuses it otherwise
    on: {fail: queue_failed}
  - id: queued
    run: pr status {{.ticket.id}}
  - id: merged
    wait: {step: queued, until: '{{and (eq .steps.queued.json.state "merged") (ne (print (or (index .steps.queued.json "merge_sha") "")) "")}}', every: 1m, timeout: 30m}
  - id: deploy
    each: .project.environments
    run: ['deploy {{quote .item.name}}', 'smoke {{quote .item.name}}']   # in order per environment; the first failure stops the rest (0755)
    when: '{{if $.steps.trust.json.deploy}}true{{else}}false{{end}}'
    reason: no deploy step, or the trust level is below 4
    on: {fail: roll_back}
  - id: landed
    run: check all --at {{quote (or (index .steps.queued.json "merge_sha") (index .steps.pr_state.json "merge_sha"))}}
    on: {ok: done, fail: roll_back}
  - id: new_commits
    ticket: >-
      transition {{.ticket.id}} --to in_progress --from ready_to_release --role {{quote (latestLine .ticket "author-role")}}
      --note {{quote (printf "Handoff: new commits after QA: head %s, QA passed %s. Back to QA after a re-check." .steps.head.json.sha (line "sha" (latest .ticket "Handoff: QA passed")))}} --release
    on: {ok: end}
  - id: queue_failed
    ticket: >-
      transition {{.ticket.id}} --to in_progress --from ready_to_release --role {{quote (latestLine .ticket "author-role")}}
      --note {{quote (printf "Handoff: the merge queue refused it (not a try): %s" .steps.merge.output_path)}} --release
    on: {ok: end}
  - id: roll_back
    each: .steps.deploy.results        # only the environments a deploy started on; none when nothing deployed
    run: rollback {{quote (index $.project.environments .index).name}}
    on: {ok: block, fail: block}       # always blocks, so a failed check on main never falls through to done
    block: {to: chief-of-staff}
done:
  to: done                           # only after landed passed; you are the only role that sets it
  note: |
    Handoff: released. Merge sha {{or (index .steps.queued.json "merge_sha") (index .steps.pr_state.json "merge_sha")}}.
    Checks on main: {{.steps.landed.summary}}
    {{- range .steps.deploy.results}}
    Smoke: {{.output_path}}{{end}}
    {{- with latest .ticket "Approved by the user:"}}
    Approval relied on: {{.}}{{end}}
    {{.run.skipped}}
