# Copy to playbooks/<role>/<job>.yaml. Format: playbooks/README.md.
name: example-job                 # the file name without .yaml
role: example-role                # the role folder name
description: One sentence on what this playbook does.
intake: {category: new-work, status: todo, kinds: [feature, bug, chore, docs]}
claim: true                       # leave out when the job claims nothing
session: ticket                   # one harness session for every prompt step
steps:
  - id: start
    ticket: transition {{.ticket.id}} --to in_progress --from todo
  - id: worktree
    run: worktree add {{.ticket.id}} --from {{.project.main_branch}}
  - id: work
    prompt: build                 # playbooks/prompts/build.md
    model: mid
    retry: {max: 1, tier_up: true}
    out: [commit, files, tests]
  - id: checks
    run: check all
    on: {fail: work}              # .limits.step_visits caps the loop
done:
  to: in_review
  note: |
    Handoff: {{.steps.work.reply.commit}} on {{.run.branch}}.
    Checks: {{.steps.checks.summary}}
    {{.run.skipped}}author-family: {{.env.family}}
    author-role: {{.run.role}}
